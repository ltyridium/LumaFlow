[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "LumaFlow"
version = "1.8.0"
description = "LED 灯光序列编排工具"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Ltyridium" },
]
keywords = [
    "led", "lighting", "timeline", "editor", "PySide6", "vlc", "stage-lighting",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "PySide6>=6.5.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyserial>=3.5",
    "bleak>=0.22.0",
    "python-vlc>=3.0.0",
    "pyqtgraph==0.13.7",
    "numba>=0.57.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "matplotlib>=3.7.0",
    "requests>=2.28.0",
    "Pillow>=9.5.0",
    "psutil>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/ltyridium/LumaFlow"
Repository = "https://github.com/ltyridium/LumaFlow"
Changelog = "https://github.com/ltyridium/LumaFlow/blob/main/CHANGELOG.md"
Issues = "https://github.com/ltyridium/LumaFlow/issues"

# GUI 入口：Windows 上不会弹出控制台窗口
[project.gui-scripts]
lumaflow = "main:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-qt>=4.0", "pytest-cov>=4.0"]
build = ["pyinstaller>=6.0"]

[tool.setuptools]
# 平铺布局：根目录的两个 .py 作为顶层模块
py-modules = ["main", "app_logic"]
# 显式包列表，避免 tests/ build_portable.py 被打包
packages = ["core", "ui", "utils", "resources"]
include-package-data = true

[tool.setuptools.package-data]
# 把 resources/ 下所有文件（icons / i18n / styles / CSVfile）随包安装
"resources" = ["*", "**/*", "**/.*"]

